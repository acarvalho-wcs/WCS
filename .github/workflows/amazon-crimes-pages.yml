name: Publish Amazon Crimes

on:
  push:
    branches:
      - amazon-crimes-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: amazon-crimes-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6

      - name: Build static Amazon Crimes snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCES=("https://6aa9fad52829c83fdafd2d37--amazoncrimes.netlify.app" "https://amazoncrimes.netlify.app")
          BASE=""
          for candidate in "${SOURCES[@]}"; do
            if curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$candidate/" -o /tmp/amazon-index.html; then
              BASE="$candidate"
              break
            fi
          done
          if [ -z "$BASE" ]; then echo "No Amazon Crimes source endpoint is currently reachable" >&2; exit 22; fi
          rm -rf _site
          mkdir -p _site/assets/css _site/assets/js _site/assets/img _site/data

          echo "Downloading the currently published frontend"
          cp /tmp/amazon-index.html _site/index.html
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/assets/css/app.css" -o _site/assets/css/app.css
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/assets/js/app.js" -o _site/assets/js/app.js
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/assets/img/wcs-brasil.png" -o _site/assets/img/wcs-brasil.png

          echo "Mirroring static JSON files referenced by the live JavaScript"
          grep -oE '/data/[A-Za-z0-9._/-]+\.json' _site/assets/js/app.js | sort -u > /tmp/amazon-data-paths.txt || true
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "_site/$(dirname "$path")"
            curl -fsSL "$BASE$path" -o "_site$path" || echo "Optional data unavailable: $path"
          done < /tmp/amazon-data-paths.txt

          echo "Snapshotting operational read APIs"
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/api/events?limit=5000" -o _site/data/events-api.json
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/api/fire-hotspots" -o _site/data/fire-hotspots.json || echo '{"type":"FeatureCollection","features":[]}' > _site/data/fire-hotspots.json
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/api/deforestation-alerts" -o _site/data/deforestation-alerts.json || echo '{"type":"FeatureCollection","features":[]}' > _site/data/deforestation-alerts.json
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/api/amazon-boundary" -o _site/data/amazon-boundary.json || echo '{"type":"FeatureCollection","features":[]}' > _site/data/amazon-boundary.json
          curl --retry 3 --retry-delay 4 --retry-all-errors -fsSL "$BASE/api/health" -o _site/data/health.json || echo '{"ok":true,"service":"amazon-crimes-pages"}' > _site/data/health.json

          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(s):
              for prefix in ("assets", "data", "api"):
                  s = s.replace("'/" + prefix + "/", "'./" + prefix + "/")
                  s = s.replace('"/' + prefix + '/', '"./' + prefix + '/')
              return s

          index_path = Path("_site/index.html")
          app_path = Path("_site/assets/js/app.js")
          css_path = Path("_site/assets/css/app.css")

          index = patch(index_path.read_text(encoding="utf-8"))
          app_path.write_text(patch(app_path.read_text(encoding="utf-8")), encoding="utf-8")
          css_path.write_text(patch(css_path.read_text(encoding="utf-8")), encoding="utf-8")

          loader = """<script type="module">
          (async () => {
            if ('serviceWorker' in navigator) {
              try {
                await navigator.serviceWorker.register('./sw.js');
                await navigator.serviceWorker.ready;
                if (!navigator.serviceWorker.controller) {
                  await new Promise(resolve => {
                    const timer = setTimeout(resolve, 2500);
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                      clearTimeout(timer);
                      resolve();
                    }, { once: true });
                  });
                }
              } catch (error) {
                console.warn('Static API adapter unavailable', error);
              }
            }
            await import('./assets/js/app.js');
          })();
          </script>"""

          index = re.sub(
              r'<script\s+type=["\']module["\']\s+src=["\'](?:\./)?assets/js/app\.js["\']\s*></script>',
              loader,
              index,
              flags=re.I
          )
          index_path.write_text(index, encoding="utf-8")
          PY

          cat > _site/sw.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', event => event.waitUntil(self.clients.claim()));

          const scopeUrl = new URL(self.registration.scope);
          const localUrl = path => new URL(path, scopeUrl).href;
          const jsonResponse = (data, status = 200) => new Response(JSON.stringify(data), {
            status,
            headers: { 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' }
          });

          let eventsPromise;
          const loadEvents = () => {
            if (!eventsPromise) {
              eventsPromise = fetch(localUrl('data/events-api.json'), { cache: 'no-store' }).then(r => r.json());
            }
            return eventsPromise;
          };

          const getEvents = payload => {
            if (Array.isArray(payload)) return payload;
            for (const key of ['events', 'data', 'items', 'results']) {
              if (Array.isArray(payload && payload[key])) return payload[key];
            }
            return [];
          };

          self.addEventListener('fetch', event => {
            const url = new URL(event.request.url);
            if (url.origin !== scopeUrl.origin || !url.pathname.startsWith(scopeUrl.pathname)) return;
            const rel = url.pathname.slice(scopeUrl.pathname.length).replace(/^\//, '');

            if (rel === 'api/events' || rel.startsWith('api/events/')) {
              event.respondWith((async () => {
                try {
                  const payload = await loadEvents();
                  if (rel === 'api/events') return jsonResponse(payload);
                  const id = decodeURIComponent(rel.slice('api/events/'.length).replace(/\/$/, ''));
                  const found = getEvents(payload).find(item => item && item.id === id);
                  return found ? jsonResponse({ event: found }) : jsonResponse({ error: 'not_found', id }, 404);
                } catch (error) {
                  return jsonResponse({ error: 'events_snapshot_unavailable', message: String(error) }, 503);
                }
              })());
              return;
            }

            if (rel === 'api/event-media') {
              const id = url.searchParams.get('id') || url.searchParams.get('event_id');
              event.respondWith(jsonResponse({ event_id: id, count: 0, media: [] }));
              return;
            }

            const snapshots = {
              'api/fire-hotspots': 'data/fire-hotspots.json',
              'api/deforestation-alerts': 'data/deforestation-alerts.json',
              'api/amazon-boundary': 'data/amazon-boundary.json',
              'api/health': 'data/health.json'
            };
            if (snapshots[rel]) {
              event.respondWith(fetch(localUrl(snapshots[rel]), { cache: 'no-store' }));
            }
          });
          EOF

          touch _site/.nojekyll

          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          payload = json.loads(Path("_site/data/events-api.json").read_text(encoding="utf-8"))
          if isinstance(payload, list):
              events = payload
          else:
              events = next((payload.get(k) for k in ("events","data","items","results") if isinstance(payload.get(k), list)), [])
          status = {
              "built_at": datetime.now(timezone.utc).isoformat(),
              "source_frontend": "https://amazoncrimes.netlify.app",
              "event_count": len(events),
              "hosting_target": "GitHub Pages",
              "runtime_event_api": "static snapshot",
              "note": "Frontend is mirrored from the current production build; dynamic read layers are snapshotted at deployment."
          }
          Path("_site/migration-status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Amazon Crimes
        id: deployment
        uses: actions/deploy-pages@v4
