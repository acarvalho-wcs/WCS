name: Publish Amazon Crimes

on:
  push:
    branches:
      - amazon-crimes-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: amazon-crimes-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: amazon-crimes
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify source package exists
        run: |
          test -f public/index.html
          test -f public/assets/js/app.js
          test -f public/data/events.json

      - name: Refresh public live-data snapshots
        run: node scripts/build-pages-data.mjs

      - name: Validate JavaScript
        run: |
          node --check public/assets/js/app.js
          node --check public/assets/js/config.js
          node --check public/assets/js/i18n.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: amazon-crimes/public

      - name: Deploy Amazon Crimes
        id: deployment
        uses: actions/deploy-pages@v4
